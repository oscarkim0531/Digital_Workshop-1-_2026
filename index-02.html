<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membrane Project - Phase 1 & 2 Visual Base</title>
    <link rel="stylesheet" href="./style-02.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
</head>
<body>

    <button id="connect-btn">Connect System</button>

    <div id="debug-controller">
        <div class="control-group">
            <label for="dist-slider">가상 거리 제어 (cm)</label>
            <input type="range" id="dist-slider" min="0" max="200" value="200">
            <span id="dist-value">200 cm</span>
        </div>
        
        <div class="control-group">
            <label>정전식 터치 시뮬레이션</label>
            <button id="touch-mock-btn" class="off">TOUCH OFF</button>
        </div>
    </div>

    <script>
        // ==========================================================================
        // 1. 전역 시스템 제어 및 인터랙션 변수 정의
        // ==========================================================================
        let pg;               
        let corners = [];     
        let selectedCorner = -1; 
        let isMappingMode = true; 

        // 현장 전시 환경 최적화 튜닝 상수
        const START_DISTANCE = 150;         // 관객 감지 시작 거리 (150cm)
        const THRESHOLD_DISTANCE = 50;      // 세포막 등장 및 포화 시작 임계점 (50cm)
        const MAX_CLOSE_DISTANCE = 20;      // 최종 밀착 최단 거리 (20cm)
        const TOUCH_HOLD_TIME = 2500;       // 통로 완전 개방까지 필요한 시간 (2.5초)

        // --- 디자인 에셋 전역 컬러 팔레트 위계화 ---
        const CLR_HEAD_HUE = '#87CEEB';     // 인지질 머리 기본 하늘색
        const CLR_HEAD_CORE = '#E0FFFF';    // 인지질 머리 중심 연한 하늘색
        const CLR_TAIL = '#90EE90';         // 인지질 꼬리 연두색
        const CLR_PROTEIN = '#FFB6C1';      // 막 단백질 핑크빛 붉은색
        
        // 입자 고유 고대비 네온 컬러 지정
        const CLR_PARTICLE_A = '#D500F9';   // 우측 진영 관객 A (네온 바이올렛)
        const CLR_PARTICLE_B = '#D0EE17';   // 좌측 진영 관객 B (형광 연두)

        // 하드웨어 입력값 시뮬레이션용 실시간 변수
        let currentDistA = 200;  
        let currentDistB = 200;  
        let isTouchA = false;    
        let isTouchB = false;    

        // 시스템 상태 및 타이머 제어 변수
        let currentPhase = 1;               // 1: 대기, 2: 진입 및 안내, 3: 임계점 포화, 4: 터치 확산
        let touchStartTime = 0;  
        let isTouchTriggered = false; 

        // [Phase 2 핵심] 안내 문구 5초 소멸 타이머 변수
        let phase2StartTime = 0;
        let isPhase2Triggered = false;

        // 그래픽 에셋 데이터 구조
        let particles = [];      

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            pg = createGraphics(600, 1000);

            pg.textAlign(CENTER, CENTER);
            pg.textFont('sans-serif');

            corners = [
                createVector(-200, -350), 
                createVector(200, -350),  
                createVector(200, 350),   
                createVector(-200, 350)   
            ];

            document.getElementById('connect-btn').addEventListener('click', connectSerial);
            setupDebugUI();
        }

        function draw() {
            // -------------------------------------------------------------
            // [STEP 1] 가상 도화지(pg) 채우기
            // -------------------------------------------------------------
            if (isMappingMode) {
                pg.background(40); 
                pg.stroke(255, 30);
                pg.strokeWeight(1);
                pg.line(0, 0, pg.width, pg.height);
                pg.line(pg.width, 0, 0, pg.height);
            } else {
                pg.background(0); 
            }

            // -------------------------------------------------------------
            // [실시간 페이즈(Phase) 판별 인터랙션 구조 리팩토링]
            // -------------------------------------------------------------
            if (isTouchA && isTouchB) {
                if (!isTouchTriggered) {
                    touchStartTime = millis(); 
                    isTouchTriggered = true;
                }
                currentPhase = 4; 
                isPhase2Triggered = false; // 타 페이즈 진입 시 초기화
            } else {
                isTouchTriggered = false; 
                
                // 두 관객 모두 진입했을 때만 Phase 2, 3 판정 분기 (상호 동기화 핵심)
                if (currentDistA <= THRESHOLD_DISTANCE && currentDistB <= THRESHOLD_DISTANCE) {
                    currentPhase = 3;
                    isPhase2Triggered = false;
                } 
                else if (currentDistA <= START_DISTANCE && currentDistB <= START_DISTANCE) {
                    currentPhase = 2; 
                    // Phase 2 진입 최초 1회 순간에만 시스템 타이머 스냅샷 기록
                    if (!isPhase2Triggered) {
                        phase2StartTime = millis();
                        isPhase2Triggered = true;
                    }
                } 
                else {
                    currentPhase = 1; 
                    isPhase2Triggered = false;
                }
            }

            // -------------------------------------------------------------
            // 🔬 비주얼 연출 파트 1: 텍스트 가이드 위계 및 Phase 2 소멸 타이머
            // -------------------------------------------------------------
            let centerX = pg.width / 2;

            if (currentPhase === 1) {
                let textA = (currentDistA <= START_DISTANCE) ? "READY" : "바닥의 표시까지 가까이 와주세요.";
                let textB = (currentDistB <= START_DISTANCE) ? "READY" : "바닥의 표시까지 가까이 와주세요.";

                // 관객 B 방향 가이드 (상단 영역)
                pg.push();
                pg.translate(centerX, pg.height * 0.45); 
                pg.fill(255);
                pg.noStroke();
                pg.textSize(22);
                pg.text(textB, 0, 0);
                pg.pop();

                // 관객 A 방향 가이드 (하단 영역 Y축 대칭 반전)
                pg.push();
                pg.translate(centerX, pg.height * 0.55); 
                pg.scale(-1, 1); 
                pg.fill(255);
                pg.noStroke();
                pg.textSize(22);
                pg.text(textA, 0, 0);
                pg.pop();
            } 
            else if (currentPhase === 2) {
                // 정확히 5초(5000ms) 동안 투명도를 깎아내는 정밀 보간 연산
                let elapsed = millis() - phase2StartTime;
                let textAlpha = 255;

                if (elapsed < 2500) {
                    textAlpha = 255; // 초반 2.5초는 가독성을 위해 100% 선명하게 유지
                } else if (elapsed >= 2500 && elapsed <= 5000) {
                    // 후반 2.5초 동안 서서히 투명도가 0으로 수렴 (Linear Alpha Fade)
                    textAlpha = map(elapsed, 2500, 5000, 255, 0);
                } else {
                    textAlpha = 0; // 5초 이후에는 완벽 소멸
                }

                if (textAlpha > 0) {
                    pg.push();
                    pg.fill(255, textAlpha);
                    pg.noStroke();
                    pg.textSize(22);
                    
                    // 상단 가이드
                    pg.push();
                    pg.translate(centerX, pg.height * 0.25);
                    pg.text("천천히 가까이 걸어오세요.", 0, 0);
                    pg.pop();
                    
                    // 하단 반전 가이드
                    pg.push();
                    pg.translate(centerX, pg.height * 0.75);
                    pg.scale(-1, 1);
                    pg.text("천천히 가까이 걸어오세요.", 0, 0);
                    pg.pop();
                    
                    pg.pop();
                }
            }

            // -------------------------------------------------------------
            // 🔬 비주얼 연출 파트 2: 거대화 및 유기적으로 숨쉬는 세포막 드로잉
            // -------------------------------------------------------------
            if (currentPhase >= 2) {
                pg.push();
                let membraneAlpha = (currentPhase === 2) ? 140 : 255; 

                // [연동 패치]: 단백질이 위치한 정중앙(Y축 500) 지점의 세포막 실제 사인파 변위값을 역계산합니다.
                // drawGiantMembrane에서 사용한 고진폭 사인파 공식(y * 0.003 + frameCount * 0.025)과 수치를 완벽히 일치시킵니다.
                let centralMembraneWave = sin(500 * 0.003 + frameCount * 0.025) * 40;
                centralMembraneWave += (noise(500 * 0.02, frameCount * 0.01) - 0.5) * 8;

                // 먼저 세포막 장벽을 렌더링합니다.
                drawGiantMembrane(membraneAlpha);

                // [연동 패치]: 단백질의 X축 중심 좌표에 세포막의 실시간 파동 변위(centralMembraneWave)를 더해 
                // 장벽이 왼쪽으로 휠 때 단백질도 왼쪽으로, 오른쪽으로 휠 때 오른쪽으로 한 몸처럼 밀리게 만듭니다.
                drawGiantChannelProtein(centerX + centralMembraneWave, pg.height / 2, currentPhase); 
                pg.pop();
            }

            // -------------------------------------------------------------
            // 🔬 비주얼 연출 파트 3: 마이크로 가리비 세포 입자 생성 및 철통 격리 유영
            // -------------------------------------------------------------
            if (currentPhase >= 2) {
                let avgDist = (currentDistA + currentDistB) / 2;
                // 관객이 가까워질수록 공간의 밀도와 포화가 느껴지도록 입자 개수 스케일 업 (최대 350개)
                let targetCount = map(avgDist, THRESHOLD_DISTANCE, START_DISTANCE, 350, 30);
                targetCount = constrain(targetCount, 30, 350);

                // 부족한 입자를 좌/우 끝 가장자리 구역에서 유기적으로 지속 유입 생성
                while (particles.length < targetCount) {
                    let isLeft = random() > 0.5;
                    particles.push(new ScallopCell(
                        isLeft ? random(0, 40) : random(pg.width - 40, pg.width), 
                        random(0, pg.height),
                        isLeft ? 'B' : 'A' // B는 형광연두(좌), A는 네온바이올렛(우)
                    ));
                }

                // 거리가 다시 멀어질 경우 서서히 입자 수 조절 제거
                if (particles.length > targetCount && currentPhase === 2) {
                    particles.splice(0, particles.length - targetCount);
                }

                // 입자 가동 엔진 업데이트 및 드로우
                for (let p of particles) {
                    p.update(currentPhase);
                    p.display();
                }
            }

            // -------------------------------------------------------------
            // [STEP 2] 메인 화면에 가상 도화지를 텍스처로 매핑하여 왜곡 투사
            // -------------------------------------------------------------
            background(0); 
            noStroke();
            texture(pg); 
            
            beginShape(QUADS);
            textureMode(NORMAL);
            vertex(corners[0].x, corners[0].y, 0, 0, 0); 
            vertex(corners[1].x, corners[1].y, 0, 1, 0); 
            vertex(corners[2].x, corners[2].y, 0, 1, 1); 
            vertex(corners[3].x, corners[3].y, 0, 0, 1); 
            endShape();

            // -------------------------------------------------------------
            // [STEP 3] 매핑 세팅 모드일 때 시각 가이드라인 및 조절 핀 연출
            // -------------------------------------------------------------
            if (isMappingMode) {
                stroke(0, 255, 0);
                strokeWeight(1.5);
                noFill();
                beginShape();
                vertex(corners[0].x, corners[0].y);
                vertex(corners[1].x, corners[1].y);
                vertex(corners[2].x, corners[2].y);
                vertex(corners[3].x, corners[3].y);
                endShape(CLOSE);

                for (let i = 0; i < 4; i++) {
                    fill(0, 255, 0);
                    noStroke();
                    ellipse(corners[i].x, corners[i].y, 14, 14);
                }
            }
        }

        // ==========================================================================
        // 🔬 [DEVELOP] 캔버스 너비 60% 장악형 유기적 세포막 그래픽 드로잉 엔진
        // ==========================================================================
        function drawGiantMembrane(membraneAlpha) {
            let centerX = pg.width / 2;

            for (let y = 0; y <= pg.height; y += 28) {
                // 중앙에 박힐 거대 단백질 통로의 Y축 영역(410 ~ 570)은 조형을 깔끔하게 비워둠
                if (y > 420 && y < 570) continue;
                

                // [교수님 크리틱 반영 핵심]: 복합 펄린 노이즈를 믹스하여 미세하게 "숨쉬며 꿈틀거리는" 유기적 파동 연산
                let macroMove = sin(y * 0.003 + frameCount * 0.025) * 30;
                let microTremor = sin(y * 0.1 + frameCount * 0.08) * 3;          // 생체막 특유의 미세한 떨림
                let brownian = (noise(y * 0.05, frameCount * 0.04) - 0.5) * 2.5; // 분자 단위의 불규칙한 거동

                macroMove += (noise(y * 0.02, frameCount * 0.01) - 0.5) * 8;

                let organicOffset = macroMove + microTremor + brownian;

                // [조형 스케일 확대]: 인지질 꼬리 너비를 기존 15px에서 80px로 대폭 늘려 60% 비례 확보
                let membraneWidth = 80;

                let leftX = centerX - membraneWidth + organicOffset;
                let rightX = centerX + membraneWidth + organicOffset;

                // --- 조형 1: [2단계 디벨롭] 찰랑거리는 이중 유기적 베지에 꼬리 사슬 묘사 ---
                pg.push();
                pg.noFill();
                pg.stroke(144, 238, 144, membraneAlpha * 0.45); 
                pg.strokeWeight(10); // 선을 얇게 쓰고 촘촘하게 겹쳐서 실제 섬유질 질감 연출

                // 매 프레임 시간의 흐름에 따라 꼬리 끝자락이 은은하게 꿈틀거리도록 파동 가중치 연산
                let tailWiggle = sin(frameCount * 0.05 + y * 0.2) * 12;
                

                // [왼쪽 인지질 장벽] 머리(leftX)에서 출발하여 중앙으로 뻗어나가는 이중 탄소 사슬
                pg.beginShape();
                pg.vertex(leftX, y);
                pg.bezierVertex(leftX + 25, y - 4, leftX + 45, y + 4 + tailWiggle, centerX - 8 + organicOffset, y + tailWiggle * 0.5);
                pg.endShape();

                pg.beginShape();
                pg.vertex(leftX, y);
                pg.bezierVertex(leftX + 20, y + 5, leftX + 40, y - 5 - tailWiggle, centerX - 12 + organicOffset, y - tailWiggle * 0.3);
                pg.endShape();

                // [오른쪽 인지질 장벽] 머리(rightX)에서 출발하여 중앙으로 뻗어 들어오는 이중 탄소 사슬
                pg.beginShape();
                pg.vertex(rightX, y);
                pg.bezierVertex(rightX - 25, y - 4, rightX - 45, y + 4 - tailWiggle, centerX + 8 + organicOffset, y - tailWiggle * 0.5);
                pg.endShape();

                pg.beginShape();
                pg.vertex(rightX, y);
                pg.bezierVertex(rightX - 20, y + 5, rightX - 40, y - 5 + tailWiggle, centerX + 12 + organicOffset, y + tailWiggle * 0.3);
                pg.endShape();
                pg.pop();

                // --- [디테일 팁 적용]: 인지질 레이어 사이에 쏙 박힌 타원형 비관통 콜레스테롤 삽입 ---
                let cholesterolNoise = noise(y * 0.15, frameCount * 0.005);
                if (cholesterolNoise > 0.7) {
                    pg.push();
                    pg.noStroke();
                    pg.fill(226, 176, 126, membraneAlpha * 0.85); // 소프트 앰버 톤 믹싱
                    let sideSide = (cholesterolNoise > 0.85) ? -35 : 35;
                    pg.ellipse(centerX + sideSide + organicOffset, y - 4, 6, 10);
                    pg.pop();
                }

                // --- [1단계 핵심]: 격자 패턴성 해체를 위한 호흡하는 구체 크기 보간 연산 ---
                // 인지질 머리들이 일제히 똑같은 크기로 굳어있지 않고, 시간과 Y축 위상에 따라 미세하게 숨쉬듯 수축이완함
                let breatheSize = sin(frameCount * 0.05 + y * 0.5) * 2.5;
                let headSize = 25 + breatheSize; // 기본 지름 25px 기준으로 유연하게 변화

                // --- 조형 3: 왼쪽 그라데이션 인지질 머리 (Sphere Fake Shading 공학 기법) ---
                pg.push();
                pg.noStroke();
                pg.translate(leftX, y);
                pg.fill(100, 180, 220, membraneAlpha); // 1 레이어 외곽: 깊은 시안 하늘색으로 입체 경계벽 형성
                pg.ellipse(0, 0, headSize, headSize);
                pg.fill(180, 245, 255, membraneAlpha); // 2 레이어 중간: 전이 영역 보간
                pg.ellipse(0, 0, headSize * 0.65, headSize * 0.75);
                pg.fill(240, 255, 255, membraneAlpha); // 3 레이어 코어: 현미경 광학 하이라이트 중심점
                pg.ellipse(-headSize * 0.18, -headSize * 0.18, headSize * 0.3, headSize * 0.3);
                pg.pop();

                // --- 조형 4: 오른쪽 그라데이션 인지질 머리 (Sphere Fake Shading 공학 기법) ---
                pg.push();
                pg.noStroke();
                pg.translate(rightX, y);
                pg.fill(100, 180, 220, membraneAlpha); 
                pg.ellipse(0, 0, headSize, headSize);
                pg.fill(180, 245, 255, membraneAlpha); 
                pg.ellipse(0, 0, headSize * 0.65, headSize * 0.75);
                pg.fill(240, 255, 255, membraneAlpha); 
                pg.ellipse(-headSize * 0.18, -headSize * 0.18, headSize * 0.3, headSize * 0.3);
                pg.pop();
            }
        }

        // ==========================================================================
        // 🔬 [수정 완료]: 변수 선언 위계 정돈으로 터치 개방 애니메이션 안정화
        // ==========================================================================
        function drawGiantChannelProtein(x, y, phase) {
            pg.push();
            pg.translate(x, y);
            
            pg.fill(255, 170, 185, 250); // 레퍼런스의 리퀴드한 핑크빛 레드 톤 유지
            pg.stroke(235, 255, 255, 220); 
            pg.strokeWeight(3.5);

            // [회전축 교정]: Y축 장벽 위계에 맞춰, 터치 시 상단/하단 쉘이 위아래(Y축)로 벌어지도록 openOffset 결합
            let openOffset = 0; 
            if (phase === 4) {
                let elapsed = millis() - touchStartTime;
                openOffset = map(elapsed, 0, TOUCH_HOLD_TIME, 0, 35);
                openOffset = constrain(openOffset, 0, 35);
            }

            // p5.js 표준 라디안 제어 상수 계산
            let halfOfPi = HALF_PI;

            // --- 조형 A: [레퍼런스 가로 회전] 유기적으로 넘실거리는 상단 단백질 서브유닛 (-openOffset) ---
            pg.beginShape();
            for (let i = 0; i <= 30; i++) {
                // 호를 그리며 왼쪽에서 오른쪽으로 상단 곡면을 타고 도는 좌표계 파싱 (180도 ~ 360도)
                let angle = map(i, 0, 30, PI, TWO_PI);
                
                // 외곽선이 굳어있지 않고 세포막 결을 따라 일렁이도록 독립 노이즈 펄싱 매립
                let pNoise = noise(cos(angle) * 1.3, sin(angle) * 1.2, frameCount * 0.02) * 12;
                
                // [조형 찌그러짐 전면 해결]: 장폭과 단폭의 비례를 리밸런싱하여 웅장하고 매끄러운 쉘 형태 도출
                let rX = 135 + pNoise; 
                let rY = 75 + pNoise; 
                
                let ptX = cos(angle) * rX;
                // 개방 시 상단 쉘 전체가 위쪽(Y축 음수 방향)으로 부드럽게 수평 이동
                let ptY = sin(angle) * rY - 18 - openOffset;
                
                // [레퍼런스 가로 고증]: 좌우 진영을 잇는 가로형 관통 홈(Horizontal Pore) 입구 스무딩 제어
                if (angle > PI && angle < PI + 0.5) {
                    ptY += (35 - pNoise * 0.3); // 상단 쉘의 왼쪽 입구 홈 파내기
                }
                if (angle > TWO_PI - 0.5 && angle < TWO_PI) {
                    ptY += (35 - pNoise * 0.3); // 상단 쉘의 오른쪽 입구 홈 파내기
                }
                pg.vertex(ptX, ptY);
            }
            pg.endShape(CLOSE);

            // --- 조형 B: [레퍼런스 가로 회전] 유기적으로 넘실거리는 하단 단백질 서브유닛 (+openOffset) ---
            pg.beginShape();
            for (let i = 0; i <= 30; i++) {
                // 오른쪽에서 출발하여 왼쪽으로 하단 곡면을 감싸 도는 역방향 궤적 파싱 (0도 ~ 180도)
                let angle = map(i, 0, 30, 0, PI);
                
                // 하단 독립 파동 위상(+35) 격리 적용으로 유기체적 비정형성 극대화
                let pNoise = noise(cos(angle) * 1.3, sin(angle) * 1.2, frameCount * 0.02 + 35) * 12;
                
                let rX = 135 + pNoise;
                let rY = 75 + pNoise;
                
                let ptX = cos(angle) * rX;
                // 개방 시 하단 쉘 전체가 아래쪽(Y축 양수 방향)으로 부드럽게 수평 이동
                let ptY = sin(angle) * rY + 18 + openOffset;
                
                // [레퍼런스 가로 고증]: 하단 쉘 좌우 관통 홈 입구 스무딩 제어
                if (angle > 0 && angle < 0 + 0.5) {
                    ptY -= (35 - pNoise * 0.3); // 하단 쉘의 오른쪽 입구 홈 파내기
                }
                if (angle > PI - 0.5 && angle < PI) {
                    ptY -= (35 - pNoise * 0.3); // 하단 쉘의 왼쪽 입구 홈 파내기
                }
                pg.vertex(ptX, ptY);
            }
            pg.endShape(CLOSE);

            pg.pop(); 
        }

        // ==========================================================================
        // 🔬 [DEVELOP] 마이크로 스케일의 가리비 세포 입자 클래스 (철통 경계벽 탑재)
        // ==========================================================================
        class ScallopCell {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'A': 우측 진영, 'B': 좌측 진영
                this.color = (type === 'A') ? CLR_PARTICLE_A : CLR_PARTICLE_B;
                
                // 거대 세포막의 웅장함을 살리기 위해 입자의 크기는 스케일 다운 컴팩트화 (5~10px)
                this.baseSize = random(5, 10);
                this.noiseSeed = random(100);
                
                // 초기 유영 속도 제어
                this.velX = random(-1.3, 1.3);
                this.velY = random(-1.3, 1.3);

                // [기획 조건 반영]: 입자 태생 순간 50% 확률로 성격 부여 잠금
                // 0: 차후 Phase 3에서 통로로 모여들 핵심 수렴 그룹
                // 1: 끝까지 자기 자리를 지키며 평화롭게 노닐 자율 유영 그룹
                this.group = random() > 0.5 ? 0 : 1; 
            }

            update(phase) {
                let centerX = pg.width / 2;

                // -------------------------------------------------------------
                // [기획 조건]: Phase 2 단계에서의 철통 진영 격리 감금 알고리즘
                // -------------------------------------------------------------
                if (phase === 2) {
                    this.x += this.velX;
                    this.y += this.velY;

                    // 상하단 외곽 벽면 튕김
                    if (this.y < 5 || this.y > pg.height - 5) this.velY *= -1;

                    // [영역 격리 패치]: Y축 위치에 따라 가두기 마지노선을 다르게 적용하여 단백질 침범을 원천 차단
                    let currentLimitX = 100; // 기본 세포막 가두기 벽 (centerX 기준 100px 내측)

                    // 입자의 실시간 Y위치가 단백질이 존재하는 중앙 영역(420~570)에 걸쳐있다면
                    if (this.y > 420 && this.y < 570) {
                        currentLimitX = 165; // 가두기 벽을 단백질 최대 폭인 165px 바깥으로 밀어내어 디펜스 행공
                    }

                    if (this.type === 'B') {
                        // 좌측 진영 입자 처리
                        if (this.x < 5) { this.x = 5; this.velX *= -1; }
                        if (this.x > centerX - currentLimitX) { 
                            this.x = centerX - currentLimitX; 
                            this.velX *= -1; 
                        } 
                    } else {
                        // 우측 진영 입자 처리
                        if (this.x < centerX + currentLimitX) { 
                            this.x = centerX + currentLimitX; 
                            this.velX *= -1; 
                        }
                        if (this.x > pg.width - 5) { this.x = pg.width - 5; this.velX *= -1; }
                    }
                }

                // -------------------------------------------------------------
                // 🔬 [Phase 3 디벨롭]: 50cm~20cm 거리에 비례한 점진적 타원 수렴 연산
                // -------------------------------------------------------------
                else if (phase === 3) {
                    if (this.group === 1) {
                        // [A 그룹 - 자율 유영]: 3단계가 되어도 통로로 모이지 않고, Phase 2의 자유 이동을 완벽히 유지
                        this.x += this.velX;
                        this.y += this.velY;

                        if (this.y < 5 || this.y > pg.height - 5) this.velY *= -1;

                        if (this.type === 'B') {
                            if (this.x < 5) { this.x = 5; this.velX *= -1; }
                            if (this.x > centerX - 100) { this.x = centerX - 100; this.velX *= -1; } 
                        } else {
                            if (this.x < centerX + 100) { this.x = centerX + 100; this.velX *= -1; }
                            if (this.x > pg.width - 5) { this.x = pg.width - 5; this.velX *= -1; }
                        }
                    } 
                    else {
                        // [B 그룹 - 수렴 관통]: 거리에 비례해 부드럽게 가속되는 자석의 힘(인력) 계산
                        let avgDist = (currentDistA + currentDistB) / 2;
                        
                        // 50cm(THRESHOLD)일 때는 0.005(거의 미동 없음) -> 20cm(MAX_CLOSE)에 도달하면 0.045(조밀하게 압착)
                        let lerpFactor = map(avgDist, MAX_CLOSE_DISTANCE, THRESHOLD_DISTANCE, 0.045, 0.005);
                        lerpFactor = constrain(lerpFactor, 0.005, 0.045);

                        // 거대 단백질 통로 1개의 정중앙 구멍 좌표 위계 (상하 대칭 영역 판단: Y축 500 기준)
                        let baseTargetY = (this.y < pg.height / 2) ? 250 : 750; // 상단/하단 통로 영역 매칭

                        // 입자 고유의 noiseSeed를 수학적 라디안 각도로 치환하여 타원형 대기 궤적 연산
                        let angleSeed = this.noiseSeed * 123.45 % TWO_PI;
                        
                        // 거대화 비례 맞춤 타원 반지름: 가로(X)는 얇게 압착(10px), 세로(Y)는 단백질 외곽 길이만큼(55px)
                        let ellipseRadiusX = random(5, 12);
                        let ellipseRadiusY = random(-55, 55);

                        let targetX, targetY;
                        if (this.type === 'B') {
                            // 좌측 형광연두 입자: 거대 단백질 좌측 등짝 경계선(centerX - 105) 기준 왼쪽으로 납작하게 정렬
                            targetX = (centerX - 105) - abs(cos(angleSeed) * ellipseRadiusX);
                            targetY = (pg.height / 2) + ellipseRadiusY; // 중앙 단백질 입구 주변 수렴
                        } else {
                            // 우측 네온바이올렛 입자: 거대 단백질 우측 등짝 경계선(centerX + 105) 기준 오른쪽으로 납작하게 정렬
                            targetX = (centerX + 105) + abs(cos(angleSeed) * ellipseRadiusX);
                            targetY = (pg.height / 2) + ellipseRadiusY;
                        }

                        // 살아 숨 쉬는 듯한 미세한 유기체적 진동(일렁임) 노이즈 가중치 추가
                        let breathX = sin(frameCount * 0.06 + this.noiseSeed) * 2;
                        let breathY = cos(frameCount * 0.06 + this.noiseSeed) * 3;

                        // 최종 선형 보간(lerp)을 통해 납작한 타원 레이어 공간으로 서서히 감속 안착 포화
                        this.x = lerp(this.x, targetX + breathX, lerpFactor);
                        this.y = lerp(this.y, targetY + breathY, lerpFactor);
                    }
                }

                // -------------------------------------------------------------
                // 🔬 [Phase 4 디벨롭]: 정전식 터치 압착 및 삼투 평형 최종 잠금 연산
                // -------------------------------------------------------------
                else if (phase === 4) {
                    let elapsed = millis() - touchStartTime;
                    
                    if (elapsed < TOUCH_HOLD_TIME) {
                        // 4-1. [초기 압착 단계: 0초 ~ 2.5초]
                        // 관객이 손을 얹은 순간, 통로 문이 열리기 전 극도의 긴장감 조성
                        if (this.group === 1) {
                            // [자율 유영 그룹]: 터치가 시작되어도 휩쓸리지 않고 기존 영역 내 자유 유영 유지
                            this.x += this.velX;
                            this.y += this.velY;
                            if (this.y < 5 || this.y > pg.height - 5) this.velY *= -1;
                            if (this.type === 'B') {
                                if (this.x < 5) { this.x = 5; this.velX *= -1; }
                                if (this.x > centerX - 100) { this.x = centerX - 100; this.velX *= -1; } 
                            } else {
                                if (this.x < centerX + 100) { this.x = centerX + 100; this.velX *= -1; }
                                if (this.x > pg.width - 5) { this.x = pg.width - 5; this.velX *= -1; }
                            }
                        } 
                        else {
                            // [수렴 그룹]: 타원형 대기 상태에서 통로 정중앙 홈 틈새(X: centerX, Y: 500)로 꽉 쥐어짜듯 극대화 압착
                            let targetX = centerX;
                            let targetY = pg.height / 2; // 중앙 단백질 입구 높이 고정
                            
                            this.x = lerp(this.x, targetX, 0.07);
                            this.y = lerp(this.y, targetY, 0.07);
                        }
                    }
                    else {
                        // 4-2. [통로 완전 개방 및 삼투 확산 단계: 2.5초 이후]
                        let burstElapsed = elapsed - TOUCH_HOLD_TIME; 
                        let speedFactor = exp(-burstElapsed * 0.0006); // 서서히 잉크처럼 번지도록 유도하는 마찰 계수

                        if (this.group === 1) {
                            // [자율 유영 그룹]: 문이 열려도 절대 관통 불가! 기존 진영 내 철통 격리 잠금 유지
                            this.x += this.velX * speedFactor;
                            this.y += this.velY * speedFactor;

                            let flowScale = 0.004;
                            let flowAngle = noise(this.x * flowScale, this.y * flowScale, frameCount * 0.012) * TWO_PI * 2;
                            this.x += cos(flowAngle) * 0.4;
                            this.y += sin(flowAngle) * 0.4;

                            if (this.y < 5) { this.y = 5; this.velY *= -1; }
                            if (this.y > pg.height - 5) { this.y = pg.height - 5; this.velY *= -1; }
                            
                            if (this.type === 'B') {
                                if (this.x < 5) { this.x = 5; this.velX *= -1; }
                                if (this.x > centerX - 100) { this.x = centerX - 100; this.velX *= -1; }
                            } else {
                                if (this.x < centerX + 100) { this.x = centerX + 100; this.velX *= -1; }
                                if (this.x > pg.width - 5) { this.x = pg.width - 5; this.velX *= -1; }
                            }
                        } 
                        else {
                            // ---------------------------------------------------------
                            // [수정 완료]: 레퍼런스 에러(damping) 해결 및 펄스 트리거 정밀화
                            // ---------------------------------------------------------
                            let isCrossed = (this.type === 'B' && this.x > centerX + 80) || (this.type === 'A' && this.x < centerX - 80);
                            if (!isCrossed) {
                                this.y = lerp(this.y, pg.height / 2, 0.25); 
                            }

                            // 최초 분출 순간에만 유효하도록 속도 절댓값 마커 검사 변경 (중복 트리거 원천 차단)
                            if (abs(this.velX) <= 1.3) {
                                let angleRange = random(-QUARTER_PI, QUARTER_PI); 
                                let burstSpeed = random(2.0, 3.2); 
                                
                                if (this.type === 'B') {
                                    this.velX = cos(angleRange) * burstSpeed;
                                    this.velY = sin(angleRange) * burstSpeed;
                                } else {
                                    this.velX = -cos(angleRange) * burstSpeed;
                                    this.velY = sin(angleRange) * burstSpeed;
                                }
                            }

                            // [오타 수정]: 존재하지 않는 damping 변수를 지우고 speedFactor 위계로 통합!
                            this.x += this.velX * speedFactor;
                            this.y += this.velY * speedFactor;

                            let flowScale = 0.005;
                            let flowAngle = noise(this.x * flowScale, this.y * flowScale, frameCount * 0.01) * TWO_PI * 2;
                            this.x += cos(flowAngle) * 0.5;
                            this.y += sin(flowAngle) * 0.5;

                            if (this.y < 5) { this.y = 5; this.velY *= -1; }
                            if (this.y > pg.height - 5) { this.y = pg.height - 5; this.velY *= -1; }

                            if (isCrossed) {
                                if (this.type === 'B') {
                                    if (this.x < centerX + 100) { this.x = centerX + 100; this.velX *= -1; }
                                    if (this.x > pg.width - 5) { this.x = pg.width - 5; this.velX *= -1; }
                                } else {
                                    if (this.x < 5) { this.x = 5; this.velX *= -1; }
                                    if (this.x > centerX - 100) { this.x = centerX - 100; this.velX *= -1; }
                                }
                            }
                        }
                    }
                }
            }

            display() {
                pg.push();
                pg.translate(this.x, this.y);
                
                let angle = atan2(this.velY, this.velX);
                if (this.type === 'A') angle += PI;
                pg.rotate(angle);
                
                pg.noStroke();
                
                // --- 레이어 1: 마이크로 입자 외곽 셸 (고유 네온 컬러링 + 반투명 광학 융합) ---
                pg.fill(this.color + 'D0'); 
                pg.beginShape();
                let resolution = 6;
                for (let i = 0; i <= resolution; i++) {
                    let a = map(i, 0, resolution, -HALF_PI, HALF_PI);
                    let rDeform = this.baseSize + noise(this.noiseSeed + frameCount * 0.04) * 3;
                    let xOffset = cos(a) * rDeform;
                    let yOffset = sin(a) * rDeform;
                    pg.curveVertex(xOffset, yOffset);
                }
                pg.vertex(-this.baseSize * 0.3, this.baseSize);
                pg.vertex(-this.baseSize * 0.3, -this.baseSize);
                pg.endShape(CLOSE);

                // --- 레이어 2: 중심 발광형 파스텔 톤 코어 그라데이션 ---
                pg.fill(224, 255, 255, 180); 
                pg.beginShape();
                for (let i = 0; i <= resolution; i++) {
                    let a = map(i, 0, resolution, -HALF_PI, HALF_PI);
                    let rInner = (this.baseSize * 0.5) + noise(this.noiseSeed + 10 + frameCount * 0.04) * 1.5;
                    let xOffset = cos(a) * rInner;
                    let yOffset = sin(a) * rInner;
                    pg.curveVertex(xOffset, yOffset);
                }
                pg.vertex(-this.baseSize * 0.15, this.baseSize * 0.5);
                pg.vertex(-this.baseSize * 0.15, -this.baseSize * 0.5);
                pg.endShape(CLOSE);

                pg.pop(); 
            }
        }

        // ==========================================================================
        // 7. 하드웨어 웹 시리얼 및 디버깅 UI 헬퍼 연동
        // ==========================================================================
        async function connectSerial() {
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 }); 
                document.getElementById('connect-btn').style.display = 'none';
                
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                const inputStream = textDecoder.readable;
                const reader = inputStream.getReader();

                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        let lines = buffer.split("\n");
                        buffer = lines.pop(); 
                        for (let line of lines) {
                            line = line.trim();
                            if (line.length > 0) {
                                let data = line.split(" ");
                                if (data.length === 2) {
                                    let val1 = Number(data[0]);
                                    let val2 = Number(data[1]);
                                    if(val1 === 10 && val2 === 10) {
                                        isTouchA = true; isTouchB = true;
                                    } else {
                                        isTouchA = false; isTouchB = false;
                                        currentDistA = val1; currentDistB = val2;
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("시리얼 연결 실패:", error);
            }
        }

        function setupDebugUI() {
            const distSlider = document.getElementById('dist-slider');
            const distValueText = document.getElementById('dist-value');
            const touchBtn = document.getElementById('touch-mock-btn');

            distSlider.addEventListener('input', (e) => {
                let val = Number(e.target.value);
                distValueText.innerText = val + " cm";
                currentDistA = val; currentDistB = val;
            });

            touchBtn.addEventListener('click', () => {
                if (!isTouchA || !isTouchB) {
                    isTouchA = true; isTouchB = true;
                    touchBtn.innerText = "TOUCH ON"; touchBtn.className = "on";
                } else {
                    isTouchA = false; isTouchB = false;
                    touchBtn.innerText = "TOUCH OFF"; touchBtn.className = "off";
                }
            });
        }
    </script>
