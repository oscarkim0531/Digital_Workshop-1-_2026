<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membrane Project - Phase 1 & 2 Visual Base</title>
    <link rel="stylesheet" href="./style-02.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
</head>
<body>

    <button id="connect-btn">Connect System</button>

    <div id="debug-controller">
        <div class="control-group" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 12px;">
            <label style="color: #D500F9; font-weight: 700;">PLAYER A (우측/하단 진영)</label>
            <label for="dist-slider-a" style="font-size: 11px; margin-top: 4px;">거리 제어 (cm)</label>
            <input type="range" id="dist-slider-a" min="0" max="200" value="200" style="accent-color: #D500F9;">
            <span id="dist-value-a" style="display: block; text-align: right; font-weight: 700; color: #D500F9;">200 cm</span>
            
            <button id="touch-mock-btn-a" class="off" style="width: 100%; padding: 6px; font-size: 10px; margin-top: 6px; cursor: pointer;">TOUCH A OFF</button>
        </div>
        
        <div class="control-group">
            <label style="color: #D0EE17; font-weight: 700;">PLAYER B (좌측/상단 진영)</label>
            <label for="dist-slider-b" style="font-size: 11px; margin-top: 4px;">거리 제어 (cm)</label>
            <input type="range" id="dist-slider-b" min="0" max="200" value="200" style="accent-color: #D0EE17;">
            <span id="dist-value-b" style="display: block; text-align: right; font-weight: 700; color: #D0EE17;">200 cm</span>
            
            <button id="touch-mock-btn-b" class="off" style="width: 100%; padding: 6px; font-size: 10px; margin-top: 6px; cursor: pointer;">TOUCH B OFF</button>
        </div>
    </div>

    <script>
        // ==========================================================================
        // 1. 전역 시스템 제어 및 인터랙션 변수 정의
        // ==========================================================================
        let pg;               
        let corners = [];     
        let selectedCorner = -1; 
        let isMappingMode = true; 
        let isShowUIMode = true;

        // 현장 전시 환경 최적화 튜닝 상수
        const START_DISTANCE = 150;         // 관객 감지 시작 거리 (150cm)
        const THRESHOLD_DISTANCE = 50;      // 세포막 등장 및 포화 시작 임계점 (50cm)
        const MAX_CLOSE_DISTANCE = 20;      // 최종 밀착 최단 거리 (20cm)
        const TOUCH_HOLD_TIME = 2500;       // 통로 완전 개방까지 필요한 시간 (2.5초)

        // --- 디자인 에셋 전역 컬러 팔레트 위계화 ---
        const CLR_HEAD_HUE = '#87CEEB';     // 인지질 머리 기본 하늘색
        const CLR_HEAD_CORE = '#E0FFFF';    // 인지질 머리 중심 연한 하늘색
        const CLR_TAIL = '#90EE90';         // 인지질 꼬리 연두색
        const CLR_PROTEIN = '#FFB6C1';      // 막 단백질 핑크빛 붉은색
        
        // 입자 고유 고대비 네온 컬러 지정
        const CLR_PARTICLE_A = '#D500F9';   // 우측 진영 관객 A (네온 바이올렛)
        const CLR_PARTICLE_B = '#D0EE17';   // 좌측 진영 관객 B (형광 연두)

        // 하드웨어 입력값 시뮬레이션용 실시간 변수
        let currentDistA = 200;  
        let currentDistB = 200;  
        let isTouchA = false;    
        let isTouchB = false;    

        // 시스템 상태 및 타이머 제어 변수
        let currentPhase = 1;               // 1: 대기, 2: 진입 및 안내, 3: 임계점 포화, 4: 터치 확산
        let touchStartTime = 0;  
        let isTouchTriggered = false; 

        // [Phase 2 핵심] 안내 문구 5초 소멸 타이머 변수
        let phase2StartTime = 0;
        let isPhase2Triggered = false;

        // 그래픽 에셋 데이터 구조
        let particles = [];      

        let isPhase2TimelineStarted = false; 
        let globalMembraneAlpha = 0;

        // [엔딩 패치]: 10초 홀드 락 플래그 및 엔딩 페이드아웃 제어 변수 위계화
        let isPhase4Locked = false;      // 10초 동시 터치 유지 시 true로 잠금 플래그
        let endingFadeAlpha = 255;       // 엔딩 시 화면 전면을 은은하게 숨길 알파 제어 변수

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            pg = createGraphics(600, 1000);

            pg.textAlign(CENTER, CENTER);
            pg.textFont('sans-serif');

            corners = [
                createVector(-200, -350), 
                createVector(200, -350),  
                createVector(200, 350),   
                createVector(-200, 350)   
            ];

            document.getElementById('connect-btn').addEventListener('click', connectSerial);
            setupDebugUI();
        }

        function draw() {
            // -------------------------------------------------------------
            // [STEP 1] 가상 도화지(pg) 채우기
            // -------------------------------------------------------------
            if (isMappingMode) {
                pg.background(40); 
                pg.stroke(255, 30);
                pg.strokeWeight(1);
                pg.line(0, 0, pg.width, pg.height);
                pg.line(pg.width, 0, 0, pg.height);
            } else {
                pg.background(0); 
            }

            // -------------------------------------------------------------
            // [엔딩 패치 완료]: 10초 터치 유지 락 장치 및 25초 엔딩 리셋 시스템
            // -------------------------------------------------------------
            let elapsedTouch = isTouchTriggered ? (millis() - touchStartTime) : 0;

            // [10초 마지노선 정밀 연산]: 4단계 진입 후 10초(10000ms) 동안 양측 모두 손을 때지 않았다면 시스템 최종 잠금 활성화
            if (currentPhase === 4 && elapsedTouch >= 10000) {
                isPhase4Locked = true; 
            }

            // 조건 분기 판단: (실제 두 명 다 터치 중이거나) OR (10초 강제 프리 패스 플래그가 잠겼을 때)
            if ((isTouchA && isTouchB) || isPhase4Locked) {
                if (!isTouchTriggered) {
                    touchStartTime = millis(); 
                    isTouchTriggered = true;
                }
                currentPhase = 4; 
                isPhase2Triggered = false; 

                // [25초 최종 엔딩 트리거]: 터치 유지 서사가 마침내 25초(25000ms)에 완벽하게 도달했을 때
                if (millis() - touchStartTime >= 25000) {
                    // 화면 전체를 부드럽게 흐려지게 만듭니다 (Linear Fade Out 보간)
                    endingFadeAlpha = lerp(endingFadeAlpha, 0, 0.04);

                    // 화면이 완전히 안개처럼 흐려져 보이지 않게 되는 마지노선 순간(알파값 5 이하)에 시스템 완전 청소 리셋
                    if (endingFadeAlpha <= 5) {
                        currentPhase = 1;
                        isTouchTriggered = false;
                        isPhase4Locked = false; // 락 해제
                        isPhase2TimelineStarted = false;
                        globalMembraneAlpha = 0;
                        endingFadeAlpha = 255; // 알파 원복
                        particles = []; // 유영하던 기존 입자 찌꺼기 버퍼 전면 청소 소멸
                        
                        // 하드웨어 가상 토글 버튼 인프라도 자동으로 강제 OFF 스위칭
                        isTouchA = false; isTouchB = false;
                        const btnA = document.getElementById('touch-mock-btn-a');
                        const btnB = document.getElementById('touch-mock-btn-b');
                        if (btnA) { btnA.innerText = "TOUCH A OFF"; btnA.className = "off"; btnA.style.backgroundColor = "transparent"; btnA.style.color = "#FFB6C1"; }
                        if (btnB) { btnB.innerText = "TOUCH B OFF"; btnB.className = "off"; btnB.style.backgroundColor = "transparent"; btnB.style.color = "#FFB6C1"; }
                    }
                }
            } else {
                // 10초를 채우지 못하고 손을 떼어버린 낙아웃 상황일 때는 철저하게 초기화 리셋
                isTouchTriggered = false; 
                isPhase4Locked = false;
                endingFadeAlpha = 255;
                
                if (currentDistA <= THRESHOLD_DISTANCE && currentDistB <= THRESHOLD_DISTANCE) {
                    currentPhase = 3;
                    isPhase2TimelineStarted = false;
                } 
                else if (currentDistA <= START_DISTANCE && currentDistB <= START_DISTANCE) {
                    currentPhase = 2; 
                    if (!isPhase2TimelineStarted) {
                        phase2StartTime = millis();
                        isPhase2TimelineStarted = true;
                    }
                } 
                else {
                    currentPhase = 1; 
                    isPhase2TimelineStarted = false;
                    globalMembraneAlpha = 0;         
                }
            }

            // -------------------------------------------------------------
            // 🔬 비주얼 연출 파트 1: 텍스트 가이드 위계 및 Phase 2 소멸 타이머
            // -------------------------------------------------------------
            let centerX = pg.width / 2;

            let centralMembraneWave = sin(500 * 0.003 + frameCount * 0.025) * 40;
            centralMembraneWave += (noise(500 * 0.02, frameCount * 0.01) - 0.5) * 8;

            if (currentPhase === 1) {
                let textA = (currentDistA <= START_DISTANCE) ? "READY" : "바닥의 표시까지 가까이 와주세요.";
                let textB = (currentDistB <= START_DISTANCE) ? "READY" : "바닥의 표시까지 가까이 와주세요.";

                // [교정 완료]: PLAYER B 가이드 텍스트 색상 채우기(fill) 문법을 분리 정돈하여 노란색(형광연두) READY 가 칼같이 출력되도록 보정
                pg.push();
                pg.translate(centerX, pg.height * 0.45); 
                if (currentDistB <= START_DISTANCE) {
                    pg.fill(160, 238, 23); // 완벽한 형광 연두 (CLR_PARTICLE_B 명시화)
                } else {
                    pg.fill(255);
                }
                pg.noStroke(); pg.textSize(22);
                pg.text(textB, 0, 0);
                pg.pop();

                // PLAYER A 가이드 텍스트 (네온 바이올렛 READY 분리 정돈)
                pg.push();
                pg.translate(centerX, pg.height * 0.55); 
                pg.scale(-1, 1); 
                if (currentDistA <= START_DISTANCE) {
                    pg.fill(213, 0, 249); // 완벽한 네온 바이올렛 (CLR_PARTICLE_A 명시화)
                } else {
                    pg.fill(255);
                }
                pg.noStroke(); pg.textSize(22);
                pg.text(textA, 0, 0);
                pg.pop();
            } 
            else if (currentPhase === 2) {
                let timelineElapsed = millis() - phase2StartTime;
                let showMembrane = false;

                // [구간 1] 0.0초 ~ 1.5초: 각자의 고유 네온 빛 READY 문구가 서서히 페이드아웃 소멸
                if (timelineElapsed >= 0 && timelineElapsed < 1500) {
                    let readyAlpha = map(timelineElapsed, 0, 1500, 255, 0);
                    pg.push(); pg.noStroke(); pg.textSize(22);
                    pg.push(); pg.translate(centerX, pg.height * 0.45); pg.fill(208, 238, 23, readyAlpha); pg.text("READY", 0, 0); pg.pop();
                    pg.push(); pg.translate(centerX, pg.height * 0.55); pg.scale(-1, 1); pg.fill(213, 0, 249, readyAlpha); pg.text("READY", 0, 0); pg.pop();
                    pg.pop();
                }
                // [구간 2] 1.5초 ~ 4.5초: '천천히 가까이 걸어오세요' 가 부드럽게 나타나서 2초간 선명히 홀드
                else if (timelineElapsed >= 1500 && timelineElapsed < 4500) {
                    let guideAlpha = (timelineElapsed < 2500) ? map(timelineElapsed, 1500, 2500, 0, 255) : 255;
                    pg.push(); pg.fill(255, guideAlpha); pg.noStroke(); pg.textSize(22);
                    pg.push(); pg.translate(centerX, pg.height * 0.25); pg.text("천천히 가까이 걸어오세요.", 0, 0); pg.pop();
                    pg.push(); pg.translate(centerX, pg.height * 0.75); pg.scale(-1, 1); pg.text("천천히 가까이 걸어오세요.", 0, 0); pg.pop();
                    pg.pop();
                }
                // [구간 3] 4.5초 ~ 6.0초: 안내 문구가 서서히 투명해지며 소멸
                else if (timelineElapsed >= 4500 && timelineElapsed < 6000) {
                    let guideAlpha = map(timelineElapsed, 4500, 6000, 255, 0);
                    pg.push(); pg.fill(255, guideAlpha); pg.noStroke(); pg.textSize(22);
                    pg.push(); pg.translate(centerX, pg.height * 0.25); pg.text("천천히 가까이 걸어오세요.", 0, 0); pg.pop();
                    pg.push(); pg.translate(centerX, pg.height * 0.75); pg.scale(-1, 1); pg.text("천천히 가까이 걸어오세요.", 0, 0); pg.pop();
                    pg.pop();
                }
                // [구간 4] 6.0초 ~ 6.7초 [지시사항 반영]: 암전 없이 가이드가 끝나자마자 즉각 0.7초 동안 투명도를 선형 보간하여 등장
                else if (timelineElapsed >= 6000 && timelineElapsed < 6700) {
                    showMembrane = true;
                    globalMembraneAlpha = map(timelineElapsed, 6000, 6700, 0, 140); 
                }
                // [구간 5] 6.7초 이후: 페이드인이 완료된 은은한 제한 알파값으로 세포막 형태 유지
                else if (timelineElapsed >= 6700) {
                    showMembrane = true;
                    globalMembraneAlpha = 140; 
                }

                if (showMembrane) {
                    pg.push();
                    drawGiantMembrane(globalMembraneAlpha);
                    drawGiantChannelProtein(centerX + centralMembraneWave, pg.height / 2, currentPhase); 
                    pg.pop();
                }
            }
            else if (currentPhase >= 3) {
                // 3단계 이상 포화 및 확산 단계: 타임라인 제약 전면 해제, 100% 풀 선명도 표출
                globalMembraneAlpha = 255; 
                pg.push();
                drawGiantMembrane(globalMembraneAlpha);
                drawGiantChannelProtein(centerX + centralMembraneWave, pg.height / 2, currentPhase); 
                pg.pop();
            }

            // -------------------------------------------------------------
            // 🔬 비주얼 연출 파트 3: 마이크로 가리비 세포 입자 생성 및 철통 격리 유영
            // -------------------------------------------------------------
            let canStartParticles = false;

            if (currentPhase === 2) {
                let timelineElapsed = millis() - phase2StartTime;
                // 안내 문구 서사가 모두 끝나고 세포막이 페이드인 시작하는 6초(6000ms) 이후부터만 입자 활성화
                if (timelineElapsed >= 6000) {
                    canStartParticles = true;
                }
            } else if (currentPhase >= 3) {
                // 3단계(포화), 4단계(터치 확산) 상태일 때는 언제나 입자 가동 허용
                canStartParticles = true;
            }

            // 조건 변수(canStartParticles)가 True일 때만 입자 엔진을 깨워 백그라운드 노이즈를 완전히 제거합니다.
            if (canStartParticles) {
                let avgDist = (currentDistA + currentDistB) / 2;
                // 관객이 가까워질수록 공간의 밀도와 포화가 느껴지도록 입자 개수 스케일 업 (최대 350개)
                let targetCount = map(avgDist, THRESHOLD_DISTANCE, START_DISTANCE, 350, 30);
                targetCount = constrain(targetCount, 30, 350);

                // 부족한 입자를 좌/우 끝 가장자리 구역에서 유기적으로 지속 유입 생성
                while (particles.length < targetCount) {
                    let isLeft = random() > 0.5;
                    particles.push(new ScallopCell(
                        isLeft ? random(0, 40) : random(pg.width - 40, pg.width), 
                        random(0, pg.height),
                        isLeft ? 'B' : 'A' // B는 형광연두(좌), A는 네온바이올렛(우)
                    ));
                }

                // 거리가 다시 멀어질 경우 서서히 입자 수 조절 제거
                if (particles.length > targetCount && currentPhase === 2) {
                    particles.splice(0, particles.length - targetCount);
                }

                // 입자 가동 엔진 업데이트 및 드로우
                for (let p of particles) {
                    p.update(currentPhase);
                    p.display();
                }
            }

            // -------------------------------------------------------------
            // [STEP 2] 메인 화면에 가상 도화지를 텍스처로 매핑하여 왜곡 투사
            // -------------------------------------------------------------
            background(0); 
            noStroke();

            // [엔딩 패치]: 25초 엔딩 리셋 시 화면 전체 캔버스의 투명도를 안개처럼 녹아내리게 제어
            tint(255, endingFadeAlpha);
            
            texture(pg); 
            
            beginShape(QUADS);
            textureMode(NORMAL);
            vertex(corners[0].x, corners[0].y, 0, 0, 0); 
            vertex(corners[1].x, corners[1].y, 0, 1, 0); 
            vertex(corners[2].x, corners[2].y, 0, 1, 1); 
            vertex(corners[3].x, corners[3].y, 0, 0, 1); 
            endShape();

            // -------------------------------------------------------------
            // [STEP 3] 매핑 세팅 모드일 때 시각 가이드라인 및 조절 핀 연출
            // -------------------------------------------------------------
            if (isMappingMode) {
                stroke(0, 255, 0);
                strokeWeight(1.5);
                noFill();
                beginShape();
                vertex(corners[0].x, corners[0].y);
                vertex(corners[1].x, corners[1].y);
                vertex(corners[2].x, corners[2].y);
                vertex(corners[3].x, corners[3].y);
                endShape(CLOSE);

                for (let i = 0; i < 4; i++) {
                    fill(0, 255, 0);
                    noStroke();
                    ellipse(corners[i].x, corners[i].y, 14, 14);
                }
            }
        }

        // ==========================================================================
        // 🔬 [DEVELOP] 캔버스 너비 60% 장악형 유기적 세포막 그래픽 드로잉 엔진
        // ==========================================================================
        function drawGiantMembrane(membraneAlpha) {
            let centerX = pg.width / 2;

            for (let y = 0; y <= pg.height; y += 28) {
                // 중앙에 박힐 거대 단백질 통로의 Y축 영역(410 ~ 570)은 조형을 깔끔하게 비워둠
                if (y > 420 && y < 570) continue;
                

                // [교수님 크리틱 반영 핵심]: 복합 펄린 노이즈를 믹스하여 미세하게 "숨쉬며 꿈틀거리는" 유기적 파동 연산
                let macroMove = sin(y * 0.003 + frameCount * 0.025) * 30;
                let microTremor = sin(y * 0.1 + frameCount * 0.08) * 3;          // 생체막 특유의 미세한 떨림
                let brownian = (noise(y * 0.05, frameCount * 0.04) - 0.5) * 2.5; // 분자 단위의 불규칙한 거동

                macroMove += (noise(y * 0.02, frameCount * 0.01) - 0.5) * 8;

                let organicOffset = macroMove + microTremor + brownian;

                // [조형 스케일 확대]: 인지질 꼬리 너비를 기존 15px에서 80px로 대폭 늘려 60% 비례 확보
                let membraneWidth = 80;

                let leftX = centerX - membraneWidth + organicOffset;
                let rightX = centerX + membraneWidth + organicOffset;

                // --- 조형 1: [2단계 디벨롭] 찰랑거리는 이중 유기적 베지에 꼬리 사슬 묘사 ---
                pg.push();
                pg.noFill();
                pg.stroke(144, 238, 144, membraneAlpha * 0.45); 
                pg.strokeWeight(10); // 선을 얇게 쓰고 촘촘하게 겹쳐서 실제 섬유질 질감 연출

                // 매 프레임 시간의 흐름에 따라 꼬리 끝자락이 은은하게 꿈틀거리도록 파동 가중치 연산
                let tailWiggle = sin(frameCount * 0.05 + y * 0.2) * 12;
                

                // [왼쪽 인지질 장벽] 머리(leftX)에서 출발하여 중앙으로 뻗어나가는 이중 탄소 사슬
                pg.beginShape();
                pg.vertex(leftX, y);
                pg.bezierVertex(leftX + 25, y - 4, leftX + 45, y + 4 + tailWiggle, centerX - 8 + organicOffset, y + tailWiggle * 0.5);
                pg.endShape();

                pg.beginShape();
                pg.vertex(leftX, y);
                pg.bezierVertex(leftX + 20, y + 5, leftX + 40, y - 5 - tailWiggle, centerX - 12 + organicOffset, y - tailWiggle * 0.3);
                pg.endShape();

                // [오른쪽 인지질 장벽] 머리(rightX)에서 출발하여 중앙으로 뻗어 들어오는 이중 탄소 사슬
                pg.beginShape();
                pg.vertex(rightX, y);
                pg.bezierVertex(rightX - 25, y - 4, rightX - 45, y + 4 - tailWiggle, centerX + 8 + organicOffset, y - tailWiggle * 0.5);
                pg.endShape();

                pg.beginShape();
                pg.vertex(rightX, y);
                pg.bezierVertex(rightX - 20, y + 5, rightX - 40, y - 5 + tailWiggle, centerX + 12 + organicOffset, y + tailWiggle * 0.3);
                pg.endShape();
                pg.pop();

                // --- [디테일 팁 적용]: 인지질 레이어 사이에 쏙 박힌 타원형 비관통 콜레스테롤 삽입 ---
                let cholesterolNoise = noise(y * 0.15, frameCount * 0.005);
                if (cholesterolNoise > 0.7) {
                    pg.push();
                    pg.noStroke();
                    pg.fill(226, 176, 126, membraneAlpha * 0.85); // 소프트 앰버 톤 믹싱
                    let sideSide = (cholesterolNoise > 0.85) ? -35 : 35;
                    pg.ellipse(centerX + sideSide + organicOffset, y - 4, 6, 10);
                    pg.pop();
                }

                // --- [1단계 핵심]: 격자 패턴성 해체를 위한 호흡하는 구체 크기 보간 연산 ---
                // 인지질 머리들이 일제히 똑같은 크기로 굳어있지 않고, 시간과 Y축 위상에 따라 미세하게 숨쉬듯 수축이완함
                let breatheSize = sin(frameCount * 0.05 + y * 0.5) * 2.5;
                let headSize = 25 + breatheSize; // 기본 지름 25px 기준으로 유연하게 변화

                // --- 조형 3: 왼쪽 그라데이션 인지질 머리 (Sphere Fake Shading 공학 기법) ---
                pg.push();
                pg.noStroke();
                pg.translate(leftX, y);
                pg.fill(100, 180, 220, membraneAlpha); // 1 레이어 외곽: 깊은 시안 하늘색으로 입체 경계벽 형성
                pg.ellipse(0, 0, headSize, headSize);
                pg.fill(180, 245, 255, membraneAlpha); // 2 레이어 중간: 전이 영역 보간
                pg.ellipse(0, 0, headSize * 0.65, headSize * 0.75);
                pg.fill(240, 255, 255, membraneAlpha); // 3 레이어 코어: 현미경 광학 하이라이트 중심점
                pg.ellipse(-headSize * 0.18, -headSize * 0.18, headSize * 0.3, headSize * 0.3);
                pg.pop();

                // --- 조형 4: 오른쪽 그라데이션 인지질 머리 (Sphere Fake Shading 공학 기법) ---
                pg.push();
                pg.noStroke();
                pg.translate(rightX, y);
                pg.fill(100, 180, 220, membraneAlpha); 
                pg.ellipse(0, 0, headSize, headSize);
                pg.fill(180, 245, 255, membraneAlpha); 
                pg.ellipse(0, 0, headSize * 0.65, headSize * 0.75);
                pg.fill(240, 255, 255, membraneAlpha); 
                pg.ellipse(-headSize * 0.18, -headSize * 0.18, headSize * 0.3, headSize * 0.3);
                pg.pop();
            }
        }

        // ==========================================================================
        // 🔬 [수정 완료]: 변수 선언 위계 정돈으로 터치 개방 애니메이션 안정화
        // ==========================================================================
        function drawGiantChannelProtein(x, y, phase) {
            pg.push();
            pg.translate(x, y);
            
            pg.fill(255, 170, 185, 250); // 레퍼런스의 리퀴드한 핑크빛 레드 톤 유지
            pg.stroke(235, 255, 255, 220); 
            pg.strokeWeight(3.5);

            // [회전축 교정]: Y축 장벽 위계에 맞춰, 터치 시 상단/하단 쉘이 위아래(Y축)로 벌어지도록 openOffset 결합
            let openOffset = 0; 
            if (phase === 4) {
                let elapsed = millis() - touchStartTime;
                openOffset = map(elapsed, 0, TOUCH_HOLD_TIME, 0, 35);
                openOffset = constrain(openOffset, 0, 35);
            }

            // p5.js 표준 라디안 제어 상수 계산
            let halfOfPi = HALF_PI;

            // --- 조형 A: [레퍼런스 가로 회전] 유기적으로 넘실거리는 상단 단백질 서브유닛 (-openOffset) ---
            pg.beginShape();
            for (let i = 0; i <= 30; i++) {
                // 호를 그리며 왼쪽에서 오른쪽으로 상단 곡면을 타고 도는 좌표계 파싱 (180도 ~ 360도)
                let angle = map(i, 0, 30, PI, TWO_PI);
                
                // 외곽선이 굳어있지 않고 세포막 결을 따라 일렁이도록 독립 노이즈 펄싱 매립
                let pNoise = noise(cos(angle) * 1.3, sin(angle) * 1.2, frameCount * 0.02) * 12;
                
                // [조형 찌그러짐 전면 해결]: 장폭과 단폭의 비례를 리밸런싱하여 웅장하고 매끄러운 쉘 형태 도출
                let rX = 135 + pNoise; 
                let rY = 75 + pNoise; 
                
                let ptX = cos(angle) * rX;
                // 개방 시 상단 쉘 전체가 위쪽(Y축 음수 방향)으로 부드럽게 수평 이동
                let ptY = sin(angle) * rY - 18 - openOffset;
                
                // [레퍼런스 가로 고증]: 좌우 진영을 잇는 가로형 관통 홈(Horizontal Pore) 입구 스무딩 제어
                if (angle > PI && angle < PI + 0.5) {
                    ptY += (35 - pNoise * 0.3); // 상단 쉘의 왼쪽 입구 홈 파내기
                }
                if (angle > TWO_PI - 0.5 && angle < TWO_PI) {
                    ptY += (35 - pNoise * 0.3); // 상단 쉘의 오른쪽 입구 홈 파내기
                }
                pg.vertex(ptX, ptY);
            }
            pg.endShape(CLOSE);

            // --- 조형 B: [레퍼런스 가로 회전] 유기적으로 넘실거리는 하단 단백질 서브유닛 (+openOffset) ---
            pg.beginShape();
            for (let i = 0; i <= 30; i++) {
                // 오른쪽에서 출발하여 왼쪽으로 하단 곡면을 감싸 도는 역방향 궤적 파싱 (0도 ~ 180도)
                let angle = map(i, 0, 30, 0, PI);
                
                // 하단 독립 파동 위상(+35) 격리 적용으로 유기체적 비정형성 극대화
                let pNoise = noise(cos(angle) * 1.3, sin(angle) * 1.2, frameCount * 0.02 + 35) * 12;
                
                let rX = 135 + pNoise;
                let rY = 75 + pNoise;
                
                let ptX = cos(angle) * rX;
                // 개방 시 하단 쉘 전체가 아래쪽(Y축 양수 방향)으로 부드럽게 수평 이동
                let ptY = sin(angle) * rY + 18 + openOffset;
                
                // [레퍼런스 가로 고증]: 하단 쉘 좌우 관통 홈 입구 스무딩 제어
                if (angle > 0 && angle < 0 + 0.5) {
                    ptY -= (35 - pNoise * 0.3); // 하단 쉘의 오른쪽 입구 홈 파내기
                }
                if (angle > PI - 0.5 && angle < PI) {
                    ptY -= (35 - pNoise * 0.3); // 하단 쉘의 왼쪽 입구 홈 파내기
                }
                pg.vertex(ptX, ptY);
            }
            pg.endShape(CLOSE);

            pg.pop(); 
        }

        // ==========================================================================
        // 🔬 [DEVELOP] 마이크로 스케일의 가리비 세포 입자 클래스 (철통 경계벽 탑재)
        // ==========================================================================
        class ScallopCell {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; 
                this.color = (type === 'A') ? CLR_PARTICLE_A : CLR_PARTICLE_B;
                
                this.baseSize = random(5, 10);
                this.noiseSeed = random(100);
                
                this.velX = random(-1.3, 1.3);
                this.velY = random(-1.3, 1.3);

                this.group = random() > 0.5 ? 0 : 1; 

                // [4단계 패치]: 생성 시점에 입자 고유의 라디안 각도 시드와 가로형 단백질 입구용 타원 정렬 오프셋을 1회만 계산해 고정 잠금합니다.
                let angleSeed = this.noiseSeed * 123.45 % TWO_PI;
                this.ellipseOffsetSumX = random(-50, 50); // 가로형 통로 폭 전체에 넓게 도열하기 위한 세로형 배치 분산
                this.ellipseOffsetSumY = abs(sin(angleSeed) * random(5, 15)); // 가로 구멍 입구로 압착되기 위한 세로 얇기 오프셋

                this.isCrossedMaster = false;
            }

            update(phase) {
                let centerX = pg.width / 2;

                // -------------------------------------------------------------
                // [기획 조건]: Phase 2 단계에서의 철통 진영 격리 감금 알고리즘
                // -------------------------------------------------------------
                if (phase === 2) {
                    this.x += this.velX;
                    this.y += this.velY;

                    // 상하단 외곽 벽면 튕김
                    if (this.y < 5 || this.y > pg.height - 5) this.velY *= -1;

                    // [영역 격리 패치]: Y축 위치에 따라 가두기 마지노선을 다르게 적용하여 단백질 침범을 원천 차단
                    let currentLimitX = 100; // 기본 세포막 가두기 벽 (centerX 기준 100px 내측)

                    // 입자의 실시간 Y위치가 단백질이 존재하는 중앙 영역(420~570)에 걸쳐있다면
                    if (this.y > 420 && this.y < 570) {
                        currentLimitX = 165; // 가두기 벽을 단백질 최대 폭인 165px 바깥으로 밀어내어 디펜스 행공
                    }

                    if (this.type === 'B') {
                        // 좌측 진영 입자 처리
                        if (this.x < 5) { this.x = 5; this.velX *= -1; }
                        if (this.x > centerX - currentLimitX) { 
                            this.x = centerX - currentLimitX; 
                            this.velX *= -1; 
                        } 
                    } else {
                        // 우측 진영 입자 처리
                        if (this.x < centerX + currentLimitX) { 
                            this.x = centerX + currentLimitX; 
                            this.velX *= -1; 
                        }
                        if (this.x > pg.width - 5) { this.x = pg.width - 5; this.velX *= -1; }
                    }
                }

                // -------------------------------------------------------------
                // 🔬 [Phase 3 디벨롭]: 50cm~20cm 거리에 비례한 점진적 타원 수렴 연산
                // -------------------------------------------------------------
                else if (phase === 3) {
                    if (this.group === 1) {
                        this.x += this.velX;
                        this.y += this.velY;

                        if (this.y < 5 || this.y > pg.height - 5) this.velY *= -1;

                        if (this.type === 'B') {
                            if (this.x < 5) { this.x = 5; this.velX *= -1; }
                            if (this.x > centerX - 100) { this.x = centerX - 100; this.velX *= -1; } 
                        } else {
                            if (this.x < centerX + 100) { this.x = centerX + 100; this.velX *= -1; }
                            if (this.x > pg.width - 5) { this.x = pg.width - 5; this.velX *= -1; }
                        }
                    } 
                    else {
                        // ==========================================================================
                        // 🔬 [Phase 3 고도화]: 50cm~10cm 거리에 완벽히 비례하는 점진적 공간 압착 엔진
                        // ==========================================================================
                        let avgDist = (currentDistA + currentDistB) / 2;
                        
                        // [피드백 반영 핵심]: 50cm에서 10cm가 될 때까지의 실시간 거리 비율(0.0 ~ 1.0)을 역산합니다.
                        // 50cm일 때는 0(확산 상태), 10cm 최단 거리에 도열할 때는 1(극한 압착 상태)이 됩니다.
                        let closeRatio = map(avgDist, 50, 10, 0, 1);
                        closeRatio = constrain(closeRatio, 0, 1);

                        // 1. 거리가 좁혀질수록 가로 유영 분산 폭을 450px(넓게 분산)에서 35px(단백질 근처 압착)로 정교하게 좁힙니다.
                        let dynamicSpreadX = lerp(450, 35, closeRatio);

                        // 2. 거리가 좁혀질수록 타원형 트랙으로 빨려 들어가는 선형 보간 자석 힘(lerpFactor)을 점진적으로 가속 증폭합니다.
                        // 50cm일 때는 0.01(부드럽게 맴돎) ➡️ 10cm에 도달하면 0.08(강력하게 고정 안착)
                        let lerpFactor = map(closeRatio, 0, 1, 0.01, 0.08);

                        // 가로형 가동 단백질의 정중앙 높이축(500) 타겟팅 유지
                        let baseTargetY = pg.height / 2; 

                        // 단백질 함수와 100% 일치하는 실시간 넘실거림 파동 변위 연산
                        let centralMembraneWave = sin(500 * 0.003 + frameCount * 0.025) * 30;
                        centralMembraneWave += (noise(500 * 0.02, frameCount * 0.01) - 0.5) * 8;

                        let targetX, targetY;
                        if (this.type === 'B') {
                            // [좌측 연두 입자]: 거리가 가까워질수록 dynamicSpreadX가 작아져 centerX - 140 지점으로 정갈하게 압축 도열
                            // 생성자에서 고정해 둔 고유 방향성 시드(ellipseOffsetSumX의 부호 정돈)를 활용해 레이어 분할
                            let spreadDirection = map(this.ellipseOffsetSumX, -50, 50, -1, 0); 
                            targetX = (centerX + centralMembraneWave - 140) + spreadDirection * dynamicSpreadX;
                            targetY = baseTargetY + this.ellipseOffsetSumY;
                        } else {
                            // [우측 바이올렛 입자]: 거리가 가까워질수록 dynamicSpreadX가 작아져 centerX + 140 지점으로 정갈하게 압축 도열
                            let spreadDirection = map(this.ellipseOffsetSumX, -50, 50, 0, 1);
                            targetX = (centerX + centralMembraneWave + 140) + spreadDirection * dynamicSpreadX;
                            targetY = baseTargetY + this.ellipseOffsetSumY;
                        }

                        // 살아 숨 쉬는 유기체적 생체 떨림 잔진동 추가
                        let breathX = sin(frameCount * 0.06 + this.noiseSeed) * 1.5;
                        let breathY = cos(frameCount * 0.06 + this.noiseSeed) * 1.5;

                        // 최종적으로 거리에 비례한 속도(lerpFactor)로 목적지 좌표를 향해 부드럽게 감속 안착시킵니다.
                        this.x = lerp(this.x, targetX + breathX, lerpFactor);
                        this.y = lerp(this.y, targetY + breathY, lerpFactor);
                    }
                }

                // -------------------------------------------------------------
                // 🔬 [Phase 4 최종 패치 완결]: 고유 색상 영구 보존 및 양방향 유체 가둠벽 마스터 엔진
                // -------------------------------------------------------------
                else if (phase === 4) {
                    let elapsed = millis() - touchStartTime;
                    
                    // 단백질 함수와 100% 동기화되는 실시간 중심축 넘실거림 파동 변위 연산
                    let centralMembraneWave = sin(500 * 0.003 + frameCount * 0.025) * 30;
                    centralMembraneWave += (noise(500 * 0.02, frameCount * 0.01) - 0.5) * 8;
                    let currentCenterX = centerX + centralMembraneWave;

                    // ---------------------------------------------------------
                    // 위계 1: 자율 유영 그룹 (기존 자리를 지키는 입자 + 관통 후 넘어온 정착 입자 통합 위계)
                    // ---------------------------------------------------------
                    if (this.group === 1) {
                        this.x += this.velX;
                        this.y += this.velY;

                        if (this.y < 5) { this.y = 5; this.velY *= -1; }
                        if (this.y > pg.height - 5) { this.y = pg.height - 5; this.velY *= -1; }
                        
                        let currentLimitX = (this.y > 420 && this.y < 570) ? 165 : 100;

                        // [핵심 교정]: 원래 진영(type)과 반대편 방 정착 플래그(isCrossedMaster)를 대조하여 실제 유영 공간 가둠벽 제어
                        if ((this.type === 'B' && !this.isCrossedMaster) || (this.type === 'A' && this.isCrossedMaster)) {
                            // [좌측 공간 가둠벽 조건]: 넘어오지 않은 노란색(B) 입자들과 우측에서 좌측으로 무사히 넘어온 보라색(A) 입자들의 유영 영역
                            if (this.x < 5) { this.x = 5; this.velX *= -1; }
                            if (this.x > currentCenterX - currentLimitX) { 
                                this.x = currentCenterX - currentLimitX; 
                                this.velX *= -1; 
                            } 
                        } else {
                            // [우측 공간 가둠벽 조건]: 넘어오지 않은 보라색(A) 입자들과 좌측에서 우측으로 무사히 넘어온 노란색(B) 입자들의 유영 영역
                            if (this.x < currentCenterX + currentLimitX) { 
                                this.x = currentCenterX + currentLimitX; 
                                this.velX *= -1; 
                            }
                            if (this.x > pg.width - 5) { this.x = pg.width - 5; this.velX *= -1; }
                        }
                    } 
                    // ---------------------------------------------------------
                    // 위계 2: 수렴 관통 그룹 (차례대로 줄 서서 일렬 가로 관통할 입자들)
                    // ---------------------------------------------------------
                    else {
                        // 입자 고유 시드를 기반으로 정밀 순차 출발 타임라인 셋업 (0~2500ms 지연분산)
                        let myDepartureTime = map(this.noiseSeed * 456.78 % 1.0, 0, 1, 0, 2500);

                        if (elapsed < myDepartureTime) {
                            // 내 차례가 오기 전: 단백질 문턱 양옆 가로 대기선에 정갈하게 정렬 유지
                            let baseTargetY = pg.height / 2; 
                            let targetX = (this.type === 'B') ? (currentCenterX - 140) + this.ellipseOffsetSumX : (currentCenterX + 140) + this.ellipseOffsetSumX;
                            
                            let breathX = sin(frameCount * 0.06 + this.noiseSeed) * 1.5;
                            let breathY = cos(frameCount * 0.06 + this.noiseSeed) * 1.5;

                            this.x = lerp(this.x, targetX + breathX, 0.05);
                            this.y = lerp(this.y, baseTargetY + this.ellipseOffsetSumY + breathY, 0.05);
                        } 
                        else {
                            // 마침내 출발 신호 획득: 단백질 Pore 정중앙 선로 진입
                            let targetY = pg.height / 2; 

                            if (this.type === 'B') {
                                // [좌측 노란 입자 ➡️ 우측 방 관통 이동]
                                if (this.x < currentCenterX + 110) {
                                    this.x += 1.8; 
                                    this.y = lerp(this.y, targetY, 0.15); 
                                } else {
                                    // [우측 방 완벽 안착 순간 패치]: 고유 타입('B')과 노란색 컬러를 영구히 보존하고 오직 정착 마커 플래그만 활성화
                                    this.group = 1; 
                                    this.isCrossedMaster = true; 
                                    
                                    this.velX = random(0.6, 1.4); 
                                    this.velY = random(-1.3, 1.3);
                                }
                            } 
                            else if (this.type === 'A') {
                                // [우측 보라 입자 ➡️ 좌측 방 관통 이동]
                                if (this.x > currentCenterX - 110) {
                                    this.x -= 1.8; 
                                    this.y = lerp(this.y, targetY, 0.15); 
                                } else {
                                    // [좌측 방 완벽 안착 순간 패치]: 고유 타입('A')과 보라색 컬러를 영구히 보존하고 오직 정착 마커 플래그만 활성화
                                    this.group = 1;
                                    this.isCrossedMaster = true; 
                                    
                                    this.velX = random(-1.4, -0.6); 
                                    this.velY = random(-1.3, 1.3);
                                }
                            }
                        }
                    }
                }
            }

            display() {
                pg.push();
                pg.translate(this.x, this.y);
                
                let angle = atan2(this.velY, this.velX);
                if (this.type === 'A') angle += PI;
                pg.rotate(angle);
                
                pg.noStroke();
                
                // --- 레이어 1: 마이크로 입자 외곽 셸 (고유 네온 컬러링 + 반투명 광학 융합) ---
                pg.fill(this.color + 'D0'); 
                pg.beginShape();
                let resolution = 6;
                for (let i = 0; i <= resolution; i++) {
                    let a = map(i, 0, resolution, -HALF_PI, HALF_PI);
                    let rDeform = this.baseSize + noise(this.noiseSeed + frameCount * 0.04) * 3;
                    let xOffset = cos(a) * rDeform;
                    let yOffset = sin(a) * rDeform;
                    pg.curveVertex(xOffset, yOffset);
                }
                pg.vertex(-this.baseSize * 0.3, this.baseSize);
                pg.vertex(-this.baseSize * 0.3, -this.baseSize);
                pg.endShape(CLOSE);

                // --- 레이어 2: 중심 발광형 파스텔 톤 코어 그라데이션 ---
                pg.fill(224, 255, 255, 180); 
                pg.beginShape();
                for (let i = 0; i <= resolution; i++) {
                    let a = map(i, 0, resolution, -HALF_PI, HALF_PI);
                    let rInner = (this.baseSize * 0.5) + noise(this.noiseSeed + 10 + frameCount * 0.04) * 1.5;
                    let xOffset = cos(a) * rInner;
                    let yOffset = sin(a) * rInner;
                    pg.curveVertex(xOffset, yOffset);
                }
                pg.vertex(-this.baseSize * 0.15, this.baseSize * 0.5);
                pg.vertex(-this.baseSize * 0.15, -this.baseSize * 0.5);
                pg.endShape(CLOSE);

                pg.pop(); 
            }
        }

        // ==========================================================================
        // 7. 하드웨어 웹 시리얼 및 디버깅 UI 헬퍼 연동
        // ==========================================================================
        async function connectSerial() {
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 }); 
                document.getElementById('connect-btn').style.display = 'none';
                
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                const inputStream = textDecoder.readable;
                const reader = inputStream.getReader();

                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        let lines = buffer.split("\n");
                        buffer = lines.pop(); 
                        for (let line of lines) {
                            line = line.trim();
                            if (line.length > 0) {
                                let data = line.split(" ");
                                if (data.length === 2) {
                                    let val1 = Number(data[0]);
                                    let val2 = Number(data[1]);
                                    if(val1 === 10 && val2 === 10) {
                                        isTouchA = true; isTouchB = true;
                                    } else {
                                        isTouchA = false; isTouchB = false;
                                        currentDistA = val1; currentDistB = val2;
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("시리얼 연결 실패:", error);
            }
        }

        function setupDebugUI() {
            // [패치]: L 키 토글 시 함께 사라지도록 커넥트 버튼 DOM 위계 바인딩 추가
            const connectBtn = document.getElementById('connect-btn');

            // 관객 A DOM 에레먼트 바인딩
            const sliderA = document.getElementById('dist-slider-a');
            const valueA = document.getElementById('dist-value-a');
            const btnA = document.getElementById('touch-mock-btn-a');

            // 관객 B DOM 엘리먼트 바인딩
            const sliderB = document.getElementById('dist-slider-b');
            const valueB = document.getElementById('dist-value-b');
            const btnB = document.getElementById('touch-mock-btn-b');

            // --- 관객 A 실시간 거리 리스너 ---
            sliderA.addEventListener('input', (e) => {
                let val = Number(e.target.value);
                valueA.innerText = val + " cm";
                currentDistA = val; // 오직 A의 거리값만 실시간 제어
            });

            // --- 관객 B 실시간 거리 리스너 ---
            sliderB.addEventListener('input', (e) => {
                let val = Number(e.target.value);
                valueB.innerText = val + " cm";
                currentDistB = val; // 오직 B의 거리값만 실시간 제어
            });

            // --- 관객 A 정전식 터치 토글 리스너 ---
            btnA.addEventListener('click', () => {
                isTouchA = !isTouchA; // 상태 반전
                if (isTouchA) {
                    btnA.innerText = "TOUCH A ON";
                    btnA.style.backgroundColor = "#D500F9";
                    btnA.style.color = "#000000";
                } else {
                    btnA.innerText = "TOUCH A OFF";
                    btnA.style.backgroundColor = "transparent";
                    btnA.style.color = "#FFB6C1";
                }
            });

            // --- 관객 B 정전식 터치 토글 리스너 ---
            btnB.addEventListener('click', () => {
                isTouchB = !isTouchB; // 상태 반전
                if (isTouchB) {
                    btnB.innerText = "TOUCH B ON";
                    btnB.style.backgroundColor = "#D0EE17";
                    btnB.style.color = "#000000";
                } else {
                    btnB.innerText = "TOUCH B OFF";
                    btnB.style.backgroundColor = "transparent";
                    btnB.style.color = "#FFB6C1";
                }
            });
        }

        // ==========================================================================
        // 🔬 [교정 완료]: 글로벌 캔버스 제어로 L 키 토글 UI/커서 멸실 엔진 정상화
        // ==========================================================================
        function keyPressed() {
            // 1. M 키: 맵핑 가이드라인 및 꼭짓점 핀 ON/OFF
            if (key === 'M' || key === 'm') {
                isMappingMode = !isMappingMode;
            }

            // 2. L 키: 하드웨어 세팅 패널, 시리얼 버튼, 마우스 커서 일괄 숨김 토글
            if (key === 'L' || key === 'l') {
                isShowUIMode = !isShowUIMode; // 상태 반전

                // HTML DOM 엘리먼트들을 실시간으로 추적하여 잡아옵니다.
                const connectBtn = document.getElementById('connect-btn');
                const debugController = document.getElementById('debug-controller');

                if (isShowUIMode) {
                    // --- UI 보이기 상태 (연구/세팅 모드) ---
                    cursor(); // [교정]: pg.을 제거하고 메인 캔버스 커서 복구 함수 호출
                    
                    if (connectBtn) connectBtn.style.display = 'block'; // 버튼 부활
                    if (debugController) debugController.style.display = 'block'; // 패널 부활
                } else {
                    // --- UI 숨기기 상태 (실전 PROJECTION 전시 모드) ---
                    noCursor(); // [교정]: pg.을 제거하고 메인 캔버스 커서 투명화 함수 호출
                    
                    if (connectBtn) connectBtn.style.display = 'none'; // 버튼 멸실
                    if (debugController) debugController.style.display = 'none'; // 패널 멸실
                }
            }
        }

        // ==========================================================================
        // 🔬 [매핑 인프라 복원]: 마우스 드래그 기반 꼭짓점 왜곡 핀 정밀 제어 엔진
        // ==========================================================================
        function mousePressed() {
            if (!isMappingMode) return;

            // WEBGL 모드 고유의 중앙 원점(0, 0) 기준 마우스 좌표계 보간 연산
            let mx = mouseX - width / 2;
            let my = mouseY - height / 2;

            // 4개의 꼭짓점 중 마우스와 가장 밀착된 코너 핀 선택 (클릭 반경 20px 마진)
            for (let i = 0; i < 4; i++) {
                let d = dist(mx, my, corners[i].x, corners[i].y);
                if (d < 20) {
                    selectedCorner = i;
                    break;
                }
            }
        }

        function mouseDragged() {
            if (!isMappingMode || selectedCorner === -1) return;

            // 마우스 커서의 궤적에 맞추어 선택된 프로젝션 꼭짓점 좌표를 실시간 매핑 왜곡 갱신
            corners[selectedCorner].x = mouseX - width / 2;
            corners[selectedCorner].y = mouseY - height / 2;
        }

        function mouseReleased() {
            // 마우스를 놓는 즉시 선택 위계를 안전하게 잠금 해제
            selectedCorner = -1;
        }
    </script>
